# Free scanners that work on private repos: osv-scanner, gitleaks, cargo-audit.
# CodeQL is deliberately absent — it needs GitHub Code Security on private repos.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    # Vendored copy: this repository is public and cannot call the private
    # TanksterAI/.github. Provenance and the way back are in that file's header.
    uses: ./.github/workflows/shared-security.yml
    with:
      ecosystem: rust
