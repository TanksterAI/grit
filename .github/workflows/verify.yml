# CI is defined once in TanksterAI/.github and called from here.
# Change the shared pipeline there, not in this file. The sandbox-claim guard
# below is Grit-specific and stays local — it has no home in a shared
# workflow used by repos that make no sandboxing claim to guard.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: TanksterAI/.github/.github/workflows/rust-ci.yml@v1
    with:
      # Cargo.toml declares rust-version = "1.85" — bumped from 1.82 because
      # zeroize and getrandom versions already in Cargo.lock require
      # edition2024, stabilised at 1.85. CI tests the version this crate
      # actually claims to support, not whatever stable happens to be.
      toolchain: "1.85"
      forbid-panics: true
      build-release: true

  # This crate must never claim to be a sandbox. It is policy isolation: it
  # checks arguments, not syscalls. If the word creeps into the docs without
  # its disclaimer, the component starts getting trusted with things it
  # cannot do.
  guard-sandbox-claim:
    name: Guard the sandbox claim
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Guard the sandbox claim
        run: |
          if grep -rniE '\bis a sandbox\b|\bsandboxes\b|\bfully sandboxed\b' README.md src/ ; then
            echo "::error::Grit must not be described as a sandbox"
            exit 1
          fi
          echo "no unqualified sandbox claim"
