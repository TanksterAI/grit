# Two of the three legs of the org-wide agent pipeline. `review` (Claude via
# claude-review.yml) was retired 30 Aug 2026 once CodeRabbit Pro went live as
# the org's sole PR reviewer -- see claude/coderabbit-pro-verdict.md and
# infrastructure-conventions.md ("Org-wide agent PR pipeline") in the
# Tankster AI project for the full record. claude-address-feedback.yml is
# unaffected: it already reads and resolves CodeRabbit's review comments the
# same way it read Claude's.
name: agent-pipeline

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

concurrency:
  group: agent-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  address-feedback:
    if: github.event_name == 'pull_request_review' || github.event_name == 'issue_comment'
    uses: TanksterAI/.github/.github/workflows/claude-address-feedback.yml@fe7f35b386161c4d39b621efe8203ef707b3c82d
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  auto-merge-gate:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","reopened","ready_for_review","labeled","unlabeled"]'), github.event.action)
    uses: TanksterAI/.github/.github/workflows/auto-merge-gate.yml@fe7f35b386161c4d39b621efe8203ef707b3c82d
