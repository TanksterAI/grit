[package]
name = "grit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A context gateway for MCP servers: per-tool policy isolation, snapshot-and-rollback of local state, and AES-256-GCM credential storage."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aes-gcm = "0.10"
sha2 = "0.10"
walkdir = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
